<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Zihin Arenası</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.box{max-width:520px}.spin{font-size:52px;animation:p .9s infinite alternate ease-in-out}@keyframes p{to{transform:scale(1.12)}}h2{margin:14px 0 8px}p{color:#aab7cc;line-height:1.5}
</style>
</head>
<body>
<div id="boot"><div class="box"><div class="spin">🧠</div><h2>Zihin Arenası açılıyor…</h2><p>İlk açılış birkaç saniye sürebilir.</p></div></div>
<script>
(async()=>{
 try{
   const urls=Array.from({length:8},(_,i)=>`app/c${i}.txt`);
   const parts=await Promise.all(urls.map(async u=>{
     const r=await fetch(u,{cache:'no-store'});
     if(!r.ok) throw new Error('Uygulama verisi eksik: '+u);
     return r.text();
   }));
   const s=parts.join('').trim();
   const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
   if(!('DecompressionStream' in window)) throw new Error('Tarayıcınız çok eski. Chrome’u güncelleyin.');
   const ds=new DecompressionStream('gzip');
   const txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
   document.open();document.write(txt);document.close();
 }catch(e){
   document.getElementById('boot').innerHTML='<div class="box"><h2>Uygulama açılamadı</h2><p>'+String(e.message||e)+'</p><p>Sayfayı yenileyin veya Chrome’u güncelleyin.</p></div>';
   console.error(e);
 }
})();
</script>
</body>
</html>
